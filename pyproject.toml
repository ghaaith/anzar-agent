[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anzar-agent"
version = "0.1.0"
description = "Anzar — Local-first AI Software Engineer Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Anzar" },
]
keywords = ["ai", "coding", "agent", "llm", "software-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "chromadb>=0.4.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-languages>=1.10.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "pygments>=2.15.0",
    "redis>=5.0.0",
    "docker>=7.0.0",
    "sqlalchemy-utils>=0.41.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]

[project.scripts]
anzar = "anzar.cli:main"

[project.urls]
Homepage = "https://github.com/ghaaith/anzar-agent"
Issues = "https://github.com/ghaaith/anzar-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anzar"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".env",
    "opencode.json",
    "*.db",
    "dist",
    "scripts/benchmark_agent.py",
    "scripts/langgraph_entry.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Cosmetic/modernization noise; keep CI focused on real problems.
ignore = ["E402", "E501", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call external LLM providers or require a configured API key",
]
